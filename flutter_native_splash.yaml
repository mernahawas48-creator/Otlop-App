flutter_native_splash:
  background_image: assets/images/splash_image.png
  android: true
  ios: true
  web: true
  fullscreen: false
  android_gravity: fill
  ios_content_mode: scaleAspectFill
  web_image_mode: cover

  android_12:
    color: "#FFFFFF"
    image: assets/images/otlob_logo_image.png
    icon_background_color: "#FFFFFF"

# Regenerate with: dart run tool/regenerate_splash.dart
# The wrapper retains the larger Android 12 icon and native wordmark.
